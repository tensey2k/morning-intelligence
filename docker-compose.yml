# Morning Intelligence Assistant - Docker Compose
# For production deployment on Oracle Free Tier VPS

version: '3.8'

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morning-intel-app
    restart: unless-stopped
    env_file:
      - config/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://morning_user:${POSTGRES_PASSWORD}@db:5432/morning_intel
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/home/appuser
    volumes:
      - ./data:/home/appuser/data
      - ./logs:/home/appuser/logs
      - ./backups:/home/appuser/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - morning-intel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: morning-intel-db
    restart: unless-stopped
    env_file:
      - config/.env
    environment:
      - POSTGRES_USER=morning_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=morning_intel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - morning-intel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morning_user -d morning_intel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis for caching and distributed locking
  redis:
    image: redis:7-alpine
    container_name: morning-intel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - morning-intel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Optional: Nginx reverse proxy for webhook endpoint
  nginx:
    image: nginx:alpine
    container_name: morning-intel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - morning-intel-network

volumes:
  postgres_data:
  redis_data:

networks:
  morning-intel-network:
    driver: bridge